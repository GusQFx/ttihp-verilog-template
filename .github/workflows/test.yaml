name: test
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: |
          if [ -f test/requirements.txt ]; then
            pip install -r test/requirements.txt
          else
            pip install cocotb pytest
          fi

      - name: Run tests
        id: run_tests
        shell: bash
        run: |
          cd test
          make clean
          # Ejecutamos make y permitimos que continúe para procesar los resultados
          make || echo "Make failed with exit code $?"
          
      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test/*.fst
            test/*.vcd
            test/results.xml
            test/output/
